name: 🚀 Feature Request
description: Suggest a new feature or improvement
title: "[Feature]: "
labels: ["enhancement"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Have an idea to improve Nuxt Umbu? Awesome 🔥

  - type: dropdown
    id: strategy
    attributes:
      label: Related strategy
      options:
        - Laravel Sanctum
        - Laravel Passport
        - Both
        - Core module
        - Documentation
    validations:
      required: true

  - type: dropdown
    id: impact
    attributes:
      label: What area does this impact?
      options:
        - Authentication flow
        - Middleware
        - SSR behavior
        - Composables
        - Documentation
        - DX (Developer Experience)
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the feature
      placeholder: Explain your idea clearly.
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      placeholder: Why is this needed?
    validations:
      required: true