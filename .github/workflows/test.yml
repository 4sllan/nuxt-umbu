name: Run Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 🛎️ Checkout do código
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      # 🔥 LIMPEZA FORÇADA (resolve bug optional deps)
      - name: 🧹 Limpar instalação anterior
        run: |
          rm -rf node_modules package-lock.json
          rm -rf playground/node_modules playground/package-lock.json

      - name: 📦 Instalar dependências (root)
        run: npm install

      - name: 📦 Instalar dependências do playground
        run: cd playground && npm install

      - name: 🔧 Preparar ambiente Nuxt
        run: npx nuxi prepare

      - name: 🔧 Preparar ambiente do Playground
        run: cd playground && npx nuxi prepare

      - name: 🚀 Iniciar Nuxt no Playground
        run: cd playground && npm run dev &

      - name: ⏳ Aguardar o servidor estar pronto
        run: sleep 15

      - name: 🔍 Rodar testes
        run: npm run test