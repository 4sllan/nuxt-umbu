name: 🧪 CI Develop

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
      - release

jobs:
  unit:
    name: 🧩 Unit + Lint + Typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      - name: Ensure pnpm is available
        run: corepack prepare pnpm@latest --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run Unit Tests
        run: pnpm test