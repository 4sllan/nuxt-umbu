name: 🧪 CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
      - release

jobs:
  unit:
    name: 🧩 Unit + Lint + Typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  e2e:
    name: 🎭 Playwright E2E
    runs-on: ubuntu-latest
    needs: unit
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Instalar browsers Playwright
        run: pnpm exec playwright install --with-deps

      - name: Rodar testes E2E
        run: pnpm exec playwright test